
name: Build FinFlow APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FinFlow ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "FinFlow ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          cp "$GITHUB_WORKSPACE/debug.keystore" .
          gradle assembleDebug

      - name: Upload FinFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
